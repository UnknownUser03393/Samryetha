[project]
name = "samryetha-backend"
version = "0.1.0"
description = "Samryetha campus forum API — Python (FastAPI) parity port of the TypeScript backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "SQLAlchemy>=2.0",
    "argon2-cffi>=23.1",
    "apscheduler<4",
    "markdown-it-py>=3.0",
    "nh3>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/samryetha"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# 宽松基线：只查 pyflakes(F) 与 pycodestyle E4/E7/E9 类真实错误，不查行宽等风格
# Lenient baseline: only pyflakes(F) + pycodestyle E4/E7/E9 real errors, no style noise
line-length = 120
target-version = "py312"
extend-exclude = ["tests"]
